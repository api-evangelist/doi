openapi: 3.2.0
info:
  description: This API is designed to provide authoritative National Park Service (NPS) data and content about parks and their facilities, events, news, alerts, and more. Explore the NPS API below and even try to make API calls. In order to try an API call, you'll need to click on the "Authorize" button below and add your API key. If you don't have an API key yet, visit our Get Started page.
  version: 1.0.0
  title: National Park Service Activities API
servers:
- url: https://developer.nps.gov/api/v1
tags:
- name: Activities
  description: Retrieve categories of activities (astronomy, hiking, wildlife watching, etc.) possible in national parks.
paths:
  /activities:
    get:
      tags:
      - Activities
      description: Returns activities available at National Park Service sites, with optional filters for activity IDs or a search term.
      operationId: getActivities
      parameters:
      - name: id
        in: query
        description: One or more activity unique IDs.
        required: false
        schema:
          type: string
      - name: q
        in: query
        description: term to search on
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return per request. Default is 50.
        required: false
        schema:
          type: integer
      - name: start
        in: query
        description: Get the next [limit] results starting with this number. Default is 0.
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        description: A comma delimited list of fields to sort the results by. Ascending order is assumed for each field unless the field name is prefixed with the unary negative which implies descending order.
        schema:
          type: string
      security:
      - api_key: []
      - api_key_header: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Invalid status value
      summary: Get activities
      x-summary-source: derived
components:
  schemas:
    Activity:
      type: object
      properties:
        total:
          type: string
          example: '2'
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for an activity record
                example: FEDA3DF8-B871-4C1A-BB96-32823860B174
              name:
                type: string
                description: Name of the activity
                example: Arts and Culture
          example:
          - id: FEDA3DF8-B871-4C1A-BB96-32823860B174
            name: Arts and Culture
          - id: F07B0BA0-A3E9-4C82-9746-57DA4953C2E6
            name: Astronomy
        limit:
          type: string
          example: '50'
        start:
          type: string
          example: '0'
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: query
    api_key_header:
      type: apiKey
      name: X-Api-Key
      in: header
x-provenance:
  method: harvested
