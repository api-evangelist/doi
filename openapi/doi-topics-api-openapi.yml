openapi: 3.2.0
info:
  description: This API is designed to provide authoritative National Park Service (NPS) data and content about parks and their facilities, events, news, alerts, and more. Explore the NPS API below and even try to make API calls. In order to try an API call, you'll need to click on the "Authorize" button below and add your API key. If you don't have an API key yet, visit our Get Started page.
  version: 1.0.0
  title: National Park Service Topics API
servers:
- url: https://developer.nps.gov/api/v1
tags:
- name: Topics
  description: Retrieve categories of topics (American revolution, music, women's history, etc.) relating to national parks.
paths:
  /topics:
    get:
      tags:
      - Topics
      description: Returns National Park Service topics, with optional filters for topic IDs or a search term.
      operationId: getTopics
      parameters:
      - name: id
        in: query
        description: One or more unique topic IDs.
        required: false
        schema:
          type: string
      - name: q
        in: query
        description: A string to search for.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return per request. Default is 50.
        required: false
        schema:
          type: integer
      - name: start
        in: query
        description: Get the next [limit] results starting with this number. Default is 0.
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        description: A comma delimited list of fields to sort the results by. Ascending order is assumed for each field unless the field name is prefixed with the unary negative which implies descending order.
        required: false
        schema:
          type: string
      security:
      - api_key: []
      - api_key_header: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '400':
          description: Invalid status data
      summary: Get topics
      x-summary-source: derived
components:
  schemas:
    Topic:
      type: object
      properties:
        total:
          type: string
          example: '3'
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for the topic record
                example: F40AC1EE-420B-457B-B519-EC6EE5280F0C
              name:
                type: string
                description: Name of the topic
                example: Animals
          example:
          - id: F40AC1EE-420B-457B-B519-EC6EE5280F0C
            name: Animals
          - id: D7EDE8D5-96B9-42AA-AE9F-DD469229F6AD
            name: Archeology
          - id: 3B611BAB-083E-4CC0-8238-862499120FD9
            name: Arctic
        limit:
          type: string
          example: '50'
        start:
          type: string
          example: '0'
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: query
    api_key_header:
      type: apiKey
      name: X-Api-Key
      in: header
