openapi: 3.2.0
info:
  description: This API is designed to provide authoritative National Park Service (NPS) data and content about parks and their facilities, events, news, alerts, and more. Explore the NPS API below and even try to make API calls. In order to try an API call, you'll need to click on the "Authorize" button below and add your API key. If you don't have an API key yet, visit our Get Started page.
  version: 1.0.0
  title: National Park Service Parkinglots API
servers:
- url: https://developer.nps.gov/api/v1
tags:
- name: parkinglots
  description: Retrieve information related to parking lots created by national parks and other NPS entities.
paths:
  /parkinglots:
    get:
      tags:
      - parkinglots
      description: Returns parking lot information for National Park Service sites, with optional filters for park codes, state codes, or a search term.
      operationId: getParkinglots
      parameters:
      - name: parkCode
        in: query
        description: A comma delimited list of park codes (each 4 characters in length).
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: stateCode
        in: query
        description: A comma delimited list of 2 character state codes.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: limit
        in: query
        description: Number of results to return per request. Default is 50.
        required: false
        schema:
          type: integer
      - name: start
        in: query
        description: Get the next [limit] results starting with this number. Default is 0.
        required: false
        schema:
          type: integer
      - name: q
        in: query
        description: term to search on
        required: false
        schema:
          type: string
      security:
      - api_key: []
      - api_key_header: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parkinglot'
        '400':
          description: Invalid status value
      summary: Get parkinglots
      x-summary-source: derived
components:
  schemas:
    Parkinglot:
      type: object
      properties:
        total:
          type: string
          example: '4'
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for the parking lot
              name:
                type: string
                description: Parkinglot name
              altName:
                type: string
                description: alternative names for this parklinglot
              description:
                type: string
                description: General description of the parkinglot
              relatedParks:
                type: array
                description: which parks are associated with this parkinglot
                items:
                  type: object
                  properties:
                    states:
                      type: string
                      example: AR
                    parkCode:
                      type: string
                      example: buff
                    designation:
                      type: string
                      example: National River
                    fullName:
                      type: string
                      example: Buffalo National River
                    url:
                      type: string
                      example: https://www.nps.gov/buff/index.htm
                    name:
                      type: string
                      example: Buffalo
              latitude:
                type: number
                description: The latitude of the parkinglot location
              longitude:
                type: number
                description: The longitude of the parkinglot location
              geometryPoiId:
                type: string
                description: Id for Geometry Point of Interest
                example: 8793be28-0d54-493f-8556-877e7ecbe937
              managedByOrganization:
                type: string
                description: which organization manages this parkinglot
                example: NPS
              timeZone:
                type: string
                description: the time zone in which this parkinglot is found
                example: ET
              webcamUrl:
                type: string
                description: URL of parkinglot webcam
              contacts:
                type: object
                description: Information about contacting the park regarding this campground
                properties:
                  phoneNumbers:
                    type: array
                    items:
                      type: object
                      properties:
                        phoneNumber:
                          type: string
                        description:
                          type: string
                        extension:
                          type: string
                        type:
                          type: string
                          enum:
                          - Voice
                          - Fax
                          - TTY
                  emailAddresses:
                    type: array
                    items:
                      type: object
                      properties:
                        emailAddress:
                          type: string
                        description:
                          type: string
              fees:
                type: array
                items:
                  type: object
                  properties:
                    cost:
                      type: string
                      example: '30'
                    description:
                      type: string
                      example: From May to October, entrance into the park including Cadillac Mountain and Blue Hill Overlook require paying a park entrance fee.  Always display your pass in your vehicle when parking in the park. Please visit our Fees & Passes page for more information.
                    title:
                      type: string
                      example: Acadia Entrance Fee - Per person or vehicle
              operatingHours:
                type: array
                description: the operating hours for this parkinglot
                items:
                  type: object
                  properties:
                    description:
                      type: string
                    exceptions:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          startDate:
                            type: string
                          endDate:
                            type: string
                          exceptionHours:
                            type: object
                            properties:
                              sunday:
                                type: string
                              monday:
                                type: string
                              tuesday:
                                type: string
                              wednesday:
                                type: string
                              thursday:
                                type: string
                              friday:
                                type: string
                              saturday:
                                type: string
                    name:
                      type: string
                      example: Cadillac Mountain
                    standardHours:
                      type: object
                      properties:
                        friday:
                          type: string
                          example: All Day
                        monday:
                          type: string
                          example: All Day
                        saturday:
                          type: string
                          example: All Day
                        sunday:
                          type: string
                          example: All Day
                        thursday:
                          type: string
                          example: All Day
                        tuesday:
                          type: string
                          example: All Day
                        wednesday:
                          type: string
                          example: All Day
              images:
                type: array
                items:
                  type: object
                  properties:
                    altText:
                      type: string
                    caption:
                      type: string
                    credit:
                      type: string
                    title:
                      type: string
                    url:
                      type: string
              accessibility:
                type: object
                properties:
                  adaFacilitiesDescription:
                    type: string
                    example: ''
                  isLotAccessibleToDisabled:
                    type: boolean
                    example: true
                  numberOfOversizeVehicleSpaces:
                    type: integer
                    example: 0
                  numberofAdaSpaces:
                    type: integer
                    example: 6
                  numberofAdaStepFreeSpaces:
                    type: integer
                    example: 6
                  numberofAdaVanAccessbileSpaces:
                    type: integer
                    example: 6
                  totalSpaces:
                    type: integer
                    example: 145
              liveStatus:
                type: object
                properties:
                  description:
                    type: string
                  estimatedWaitTimeInMinutes:
                    type:
                    - integer
                    - 'null'
                    example: 0
                  expirationDate:
                    type: string
                  isActive:
                    type: boolean
                    example: true
                  occupancy:
                    type: string
                    example: Light
