openapi: 3.2.0
info:
  description: This API is designed to provide authoritative National Park Service (NPS) data and content about parks and their facilities, events, news, alerts, and more. Explore the NPS API below and even try to make API calls. In order to try an API call, you'll need to click on the "Authorize" button below and add your API key. If you don't have an API key yet, visit our Get Started page.
  version: 1.0.0
  title: National Park Service Amenities/parksvisitorcenters API
servers:
- url: https://developer.nps.gov/api/v1
tags:
- name: amenities/parksvisitorcenters
  description: Retrieve visitor centers within national parks that have different amenities.
paths:
  /amenities/parksvisitorcenters:
    get:
      tags:
      - amenities/parksvisitorcenters
      description: Returns amenity records associated with park visitor centers, with optional filters for park codes, amenity IDs, or a search term.
      operationId: getAmenitiesParksvisitorcenters
      parameters:
      - name: parkCode
        in: query
        description: A comma delimited list of 4 character park codes.
        required: false
        schema:
          type: string
      - name: id
        in: query
        description: A comma delimited list of amenity IDs.
        required: false
        schema:
          type: string
      - name: q
        in: query
        description: A string to search for.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return per request. Default is 50.
        required: false
        schema:
          type: integer
      - name: start
        in: query
        description: Get the next [limit] results starting with this number. Default is 0.
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        description: A comma delimited list of fields to sort the results by. Ascending order is assumed for each field unless the field name is prefixed with the unary negative which implies descending order.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      security:
      - api_key: []
      - api_key_header: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmenitiesParksVisitorCenters'
        '400':
          description: Invalid status value
      summary: Get amenities parksvisitorcenters
      x-summary-source: derived
components:
  schemas:
    AmenitiesParksVisitorCenters:
      type: object
      properties:
        total:
          type: string
          example: '53'
        data:
          type: array
          items:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  description: Unique identifier for this amenity
                  example: 75F2DA2A-1741-445A-9FA7-B63A81E4BD7F
                name:
                  type: string
                  description: The name for this amenity
                  example: Accessibility - Accessible Restroom
                parks:
                  type: array
                  items:
                    type: object
                    properties:
                      states:
                        type: string
                        description: two letter state code
                        example: SD
                      parkCode:
                        type: string
                        description: four letter park code
                        example: moru
                      designation:
                        type: string
                        description: Type of designation (eg, national park, national monument, national recreation area, etc)
                        example: National Memorial
                      visitorcenters:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              description: URL for the Visitor Center
                              example: https://www.nps.gov/moru/planyourvisit/placestogo.htm
                            id:
                              type: string
                              description: Unique identifier for the Visitor Center
                              example: AB856735-B829-4053-8BB2-9A27BC193084
                            name:
                              type: string
                              description: Name of the Visitor Center
                              example: Lincoln Borglum Visitor Center
                      fullName:
                        type: string
                        description: ''
                        example: ''
                      url:
                        type: string
                        description: ''
                        example: https://www.nps.gov/moru/index.htm
                      name:
                        type: string
                        description: ''
                        example: Mount Rushmore
        limit:
          type: string
          example: '50'
        start:
          type: string
          example: '0'
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: query
    api_key_header:
      type: apiKey
      name: X-Api-Key
      in: header
x-provenance:
  method: harvested
  publisher: Department of Interior
  source: https://www.nps.gov/subjects/developer/customcf/swagger.json?03142019
