openapi: 3.2.0
info:
  description: This API is designed to provide authoritative National Park Service (NPS) data and content about parks and their facilities, events, news, alerts, and more. Explore the NPS API below and even try to make API calls. In order to try an API call, you'll need to click on the "Authorize" button below and add your API key. If you don't have an API key yet, visit our Get Started page.
  version: 1.0.0
  title: National Park Service Newsreleases API
servers:
- url: https://developer.nps.gov/api/v1
tags:
- name: newsreleases
  description: Retrieve news releases created by national parks and other NPS entities.
paths:
  /newsreleases:
    get:
      tags:
      - newsreleases
      description: Returns National Park Service news releases, with optional filters for park codes, state codes, or a search term.
      operationId: getNewsReleases
      parameters:
      - name: parkCode
        in: query
        description: A comma delimited list of park codes (each 4 characters in length).
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: stateCode
        in: query
        description: A comma delimited list of 2 character state codes.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: limit
        in: query
        description: Number of results to return per request. Default is 50.
        required: false
        schema:
          type: integer
      - name: start
        in: query
        description: Get the next [limit] results starting with this number. Default is 0.
        required: false
        schema:
          type: integer
      - name: q
        in: query
        description: Term to search on
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: A comma delimited list of resource properties to sort the results by. Each resource identifies which properties are 'sortable'. Ascending order is assumed for each property. If descending order is desired, the unary negative should prefix the property name. The sortable properties are listed in the documentation for each resource. Invalid property values will be ignored. Default is -releaseDate.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      security:
      - api_key: []
      - api_key_header: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsRelease'
        '400':
          description: Invalid status value
      summary: Get news releases
      x-summary-source: derived
components:
  schemas:
    NewsRelease:
      type: object
      properties:
        total:
          type: string
          example: '1889'
        data:
          type: array
          items:
            type: object
            properties:
              abstract:
                type: string
                description: Short description of news release content
              geometryPoiId:
                type: string
                description: Id for Geometry Point of Interest
                example: 8793be28-0d54-493f-8556-877e7ecbe937
              id:
                type: string
                description: Unique identifier for the news release
              image:
                type: object
                description: News release image
                properties:
                  credit:
                    type: string
                  altText:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  caption:
                    type: string
                  url:
                    type: string
              latitude:
                type:
                - string
                - 'null'
                description: The latitude of the news release location
              longitude:
                type:
                - string
                - 'null'
                description: The longitude of the news release location
              parkCode:
                type: string
                description: A variable width character code that uniquely identifies a specific park
              relatedOrganizations:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: 1ED09DFF-E65B-425F-8596-7087FAC00343
                    url:
                      type: string
                      example: http://www.nps.gov/orgs/1563/
                    name:
                      type: string
                      example: Investigative Services
              relatedParks:
                type: array
                items:
                  type: object
                  properties:
                    states:
                      type: string
                      example: AR
                    parkCode:
                      type: string
                      example: buff
                    designation:
                      type: string
                      example: National River
                    fullName:
                      type: string
                      example: Buffalo National River
                    url:
                      type: string
                      example: https://www.nps.gov/buff/index.htm
                    name:
                      type: string
                      example: Buffalo
              releaseDate:
                type: string
                description: Date news release was released
              credit:
                type: string
              lastIndexedDate:
                type: string
              title:
                type: string
                description: News release title
              url:
                type: string
                description: Link to full news release
          example:
          - abstract: Chesapeake and Ohio (C&O) Canal National Historical Park will be conducting hazardous tree pruning and removal at five locations in Montgomery County; these locations are Riley’s Lock, Marsden Tract, Violettes Lock, Great Falls, and Anglers.
            id: '5604563'
            image:
              credit: ''
              altText: ''
              title: ''
              description: ''
              caption: ''
              url: ''
            latitude: '40.7034'
            longitude: '-74.0168'
            parkCode: choh
            relatedOrganizations:
            - id: 1ED09DFF-E65B-425F-8596-7087FAC00343
              url: http://www.nps.gov/orgs/1563/
              name: Investigative Services
            relatedParks:
            - states: AR
              parkCode: buff
              designation: National River
              fullName: Buffalo National River
              url: https://www.nps.gov/buff/index.htm
              name: Buffalo
            releaseDate: '2017-07-31 06:45:00.0'
            title: C&O Canal NHP begins hazardous tree maintenance in Montgomery County
            url: https://www.nps.gov/choh/learn/news/hazardous-tree-maintenance.htm
          - abstract: This week, Branching Out field teams from Boston and New York City met at Sagamore Hill National Historic Site for a four-day long gathering to learn about landscape management and work on various projects with park staff.
            id: '5604164'
            image:
              credit: NPS/Paul Cecere
              altText: Working on the nature trial
              title: Branching Out students ready for work on the nature trail
              description: Branching Out students ready for work on the nature trail.
              caption: Branching Out students ready for work on the nature trail.
              url: https://www.nps.gov/sahi/learn/news/images/IMG_5819_1.JPG
            parkCode: sahi
            releaseDate: '2017-07-30 12:30:00.0'
            title: Branching Out Field Teams Converge on Sagamore Hill
            url: https://www.nps.gov/sahi/learn/news/branching-out-field-teams-converge-on-sagamore-hill.htm
        limit:
          type: string
          example: '50'
        start:
          type: string
          example: '0'
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: query
    api_key_header:
      type: apiKey
      name: X-Api-Key
      in: header
