openapi: 3.2.0
info:
  description: This API is designed to provide authoritative National Park Service (NPS) data and content about parks and their facilities, events, news, alerts, and more. Explore the NPS API below and even try to make API calls. In order to try an API call, you'll need to click on the "Authorize" button below and add your API key. If you don't have an API key yet, visit our Get Started page.
  version: 1.0.0
  title: National Park Service Events API
servers:
- url: https://developer.nps.gov/api/v1
tags:
- name: Events
  description: Retrieve events created by national parks and other NPS entities.
paths:
  /events:
    get:
      tags:
      - Events
      description: Returns events associated with National Park Service sites, with optional filters for location, date, event type, tags, or search term.
      operationId: getEvents
      parameters:
      - name: parkCode
        in: query
        description: A comma delimited list of park codes (each 4 characters in length).
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: organization
        in: query
        description: A comma delimited list of organization site codes.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: subject
        in: query
        description: A comma delimited list of subject site codes.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: portal
        in: query
        description: A comma delimited list of portal site codes.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: tagsAll
        in: query
        description: A comma delimited list of tags that must be included.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: tagsOne
        in: query
        description: A comma delimited list of tags that may be included.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: tagsNone
        in: query
        description: A comma delimited list of tags that must not be included.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: stateCode
        in: query
        description: A comma delimited list of 2 character state codes.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: dateStart
        in: query
        description: A stating date in the yyyy-mm-dd format to filter events by.
        required: false
        schema:
          type: string
      - name: dateEnd
        in: query
        description: An ending date in the yyyy-mm-dd format to filter events by.
        required: false
        schema:
          type: string
      - name: eventType
        in: query
        description: A comma delimited list of event types.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: id
        in: query
        description: A unique ID string for an event.
        required: false
        schema:
          type: string
      - name: q
        in: query
        description: Term to search on.
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: The number of results per page. Default is 10.
        required: false
        schema:
          type: integer
      - name: pageNumber
        in: query
        description: The current page number for the results. Default is 1.
        required: false
        schema:
          type: integer
      - name: expandRecurring
        in: query
        description: A flag to denote whether or not to expand the recurring events out into multiple records (one per event date). Default is false.
        required: false
        schema:
          type: boolean
      security:
      - api_key: []
      - api_key_header: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid status value
      summary: Get events
      x-summary-source: derived
components:
  schemas:
    Event:
      type: object
      properties:
        total:
          type: string
          example: '745'
        errors:
          type: array
          items:
            type: object
        data:
          type: array
          items:
            type: object
            properties:
              contactemailaddress:
                type: string
                description: Email address for event contact
              contactname:
                type: string
                description: Name of event contact
              contacttelephonenumber:
                type: string
                description: Phone number for event contact
              category:
                type: string
                description: Category for event
              categoryid:
                type: string
                example: '1'
              createuser:
                type: string
              dateend:
                type: string
                format: date
                description: End date for event
              date:
                type: string
                format: date
                description: Date of next upcoming event
              dates:
                type: array
                description: Array of event dates
                items:
                  type: string
                  format: date
              datestart:
                type: string
                format: date
                description: Start date for event
              datetimecreated:
                type: string
              datetimeupdated:
                type:
                - string
                - 'null'
              description:
                type: string
                description: Event description
              eventid:
                type: string
                example: '0'
              feeinfo:
                type: string
                description: Fee information for event
              geometryPoiId:
                type: string
                description: Id for Geometry Point of Interest
                example: 8793be28-0d54-493f-8556-877e7ecbe937
              id:
                type: string
                description: Unique identifier for this event
                example: F0092036-921D-2344-8498FB0012847F3C
              imageidlist:
                type: string
              images:
                type: array
                items:
                  type: object
                  description: Event image
                  properties:
                    altText:
                      type: string
                      description: Image alt text
                    caption:
                      type: string
                      description: Image caption
                    credit:
                      type: string
                      description: Image credit
                    imageId:
                      type: string
                      example: '21803'
                    ordinal:
                      type: string
                      example: '0'
                    path:
                      type: string
                      example: /common/uploads/event_calendar/1B853925-E059-D529-0C87BCF597BE816B.jpg
                    title:
                      type: string
                      description: Image title
                    url:
                      type: string
                      description: Image URL
              infourl:
                type: string
                description: URL for more information about the event
              isallday:
                type: string
                description: The event takes place all day
              isfree:
                type: string
                description: The event is free
              isrecurring:
                type: string
                description: The event has recurrence
              isregresrequired:
                type: string
                description: The event requires registration or reservation
              latitude:
                type:
                - string
                - 'null'
                description: The latitude of the event location
              location:
                type: string
                description: The location the event takes place
              longitude:
                type:
                - string
                - 'null'
                description: The longitude of the event location
              organizationname:
                type: string
                description: Name of the organization associated with event
              parkfullname:
                type: string
                description: Name and designation of the park associated with event
              portalname:
                type: string
                description: Name of the portal site associated with event
              recurrencedateend:
                type: string
                format: date
                description: Date the event recurrence ends
              recurrencedatestart:
                type: string
                format: date
                description: Date the event recurrence starts
              recurrencerule:
                type: string
                description: Recurrence rule for event
              regresinfo:
                type: string
                description: Additional information on required reservation or registration for event
              regresurl:
                type: string
                description: URL for required reservation or registration for event
              sitecode:
                type: string
                description: Site code of the associated site for event
              sitetype:
                type: string
                description: Site type of the associated site for event
              subjectname:
                type: string
                description: Name of associated subject site for event
              tags:
                type: array
                description: Tags associated with event
                items:
                  type: string
              timeinfo:
                type: string
                description: Additional information about times for event
              times:
                type: array
                description: Time information for event
                items:
                  type: object
                  properties:
                    sunrisestart:
                      type: string
                      description: Event begins at sunrise
                      example: 'true'
                    sunsetend:
                      type: string
                      description: Event ends at sunset
                      example: 'false'
                    timestart:
                      type: string
                      description: Time event begins
                    timeend:
                      type: string
                      description: Time event ends
              title:
                type: string
                description: Event title
              types:
                type: array
                description: Type(s) of event
                items:
                  type: string
          example:
          - category: Regular Event
            categoryid: '0'
            contactemailaddress: example@nps.gov
            contactname: John Doe
            contacttelephonenumber: '9999999999'
            createuser: ''
            date: '2019-09-14'
            dateend: '2017-09-16'
            dates:
            - '2017-09-16'
            - '2018-09-15'
            - '2019-09-14'
            datestart: '2017-09-16'
            datetimecreated: ''
