openapi: 3.2.0
info:
  description: This API is designed to provide authoritative National Park Service (NPS) data and content about parks and their facilities, events, news, alerts, and more. Explore the NPS API below and even try to make API calls. In order to try an API call, you'll need to click on the "Authorize" button below and add your API key. If you don't have an API key yet, visit our Get Started page.
  version: 1.0.0
  title: National Park Service People API
servers:
- url: https://developer.nps.gov/api/v1
tags:
- name: People
  description: Retrieve articles providing a synopsis of specific people related to national parks.
paths:
  /people:
    get:
      tags:
      - People
      description: Returns people associated with National Park Service sites, with optional filters for park codes, state codes, or a search term.
      operationId: getPeople
      parameters:
      - name: parkCode
        in: query
        description: A comma delimited list of park codes (each 4-10 characters in length).
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: stateCode
        in: query
        description: A comma delimited list of 2 character state codes.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: limit
        in: query
        description: Number of results to return per request. Default is 50.
        required: false
        schema:
          type: integer
      - name: start
        in: query
        description: Get the next [limit] results starting with this number. Default is 0.
        required: false
        schema:
          type: integer
      - name: q
        in: query
        description: Term to search on
        required: false
        schema:
          type: string
      security:
      - api_key: []
      - api_key_header: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Invalid status value
      summary: Get people
      x-summary-source: derived
components:
  schemas:
    Person:
      type: object
      properties:
        total:
          type: string
          example: '451'
        data:
          type: array
          items:
            type: object
            properties:
              bodyText:
                type: string
                example: '<p>Though trained as an actress, <strong>Pauline Cushman-Fryer</strong>''s legacy is her service as a spy for the Union during the Civil War. During a stage performance in Louisville, Kentucky, Cushman-Fryer boldly proposed a toast to Jefferson Davis at the behest of Union officers (in the script, the toast was supposed to go to President Lincoln). Impressed by her &quot;loyalty,&quot; Confederate officers took her into their confidence. Months later, a curious Confederate sentry arrested her with information on the whereabouts of the Army of Tennessee and she was sent to Gen. Bragg''s headquarters. When her identity as a spy was confirmed, Pauline Cushman-Fryer was sentenced to be hanged.</p>


                  <p>Before the sentence could be carried out, however, Union forces captured the town of Shelbyville and the Confederates quickly retreated--leaving Cushman-Fryer behind. Following her brush with death, the army awarded Pauline Cushman-Fryer the brevet rank of major for her heroic service as a spy. She died in San Francisco in 1893 and is interred in the <a href="https://www.nps.gov/prsf/historyculture/san-francisco-national-cemetery.htm" id="CP___PAGEID=137178,san-francisco-national-cemetery.htm,2253|">San Francisco National Cemetery</a> in the Presidio.</p>


                  <p><em>Pauline Cushman-Fryer is buried in the Officers'' Section.</em></p>'
              id:
                type: string
                description: Uniquely identifies person record
                example: 7013F68B-9DAC-4C96-B1C5-0256CC6D1494
              geometryPoiId:
                type: string
                description: Id for Geometry Point of Interest
                example: 8793be28-0d54-493f-8556-877e7ecbe937
              firstName:
                type: string
                example: Pauline
              middleName:
                type: string
                example: Cushman
              lastName:
                type: string
                example: Fryer
              images:
                type: array
                items:
                  type: object
                  properties:
                    credit:
                      type: string
                      example: Golden Gate National Recreation Area Park Archives
                    crops:
                      type: array
                      items:
                        type: object
                        properties:
                          aspectRatio:
                            type: string
                          url:
                            type: string
                      example: []
                    altText:
                      type: string
                      example: Portrait Pauline Cushman Fryer in soldier uniform
                    title:
                      type: string
                      example: ''
                    caption:
                      type: string
                      example: ''
                    description:
                      type: string
                    url:
                      type: string
                      example: https://www.nps.gov/common/uploads/people/nri/20200814/people/34BCEDFA-D585-62B8-086046B6CEF7BACC/34BCEDFA-D585-62B8-086046B6CEF7BACC.jpg
              latLong:
                type: string
                description: geospatial coordinates
              latitude:
                type: string
                example: ''
              listingDescription:
                type: string
                description: Short description of the content
                example: Actress and Civil War spy, Pauline Cushman-Fryer narrowly escaped execution for her service to the Union cause. Undercover in Tennessee she performed an illness to escape hanging. She is buried in the Officer's section of the San Francisco National Cemetery at the Presidio.
              longitude:
                type: string
              quickFacts:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: F7A67C96-173F-4675-B374-7E3D3A1818B2
                    value:
                      type: string
                      example: Civil War Spy
                    name:
                      type: string
                      example: 'Significance: '
              relatedOrganizations:
                type: array
                items:
                  type: object
                example: []
              relatedParks:
                type: array
                items:
                  type: object
                  properties:
                    states:
                      type: string
                      example: CA
                    fullName:
                      type: string
                      example: Golden Gate National Recreation Area
                    url:
                      type: string
                      example: https://www.nps.gov/goga/index.htm
                    parkCode:
                      type: string
                      example: goga
                    designation:
                      type: string
                      example: National Recreation Area
                    name:
                      type: string
                      example: Golden Gate
                description: Parks which have a tie to this asset
              title:
                type: string
                description: Asset title
                example: Pauline Cushman-Fryer
              url:
                type: string
                description: Link to more information about the asset, if available
              credit:
                type: string
              tags:
                type: array
                items:
                  type: string
        limit:
          type: string
          example: '50'
        start:
          type: string
          example: '0'
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: query
    api_key_header:
      type: apiKey
      name: X-Api-Key
      in: header
