openapi: 3.2.0
info:
  description: This API is designed to provide authoritative National Park Service (NPS) data and content about parks and their facilities, events, news, alerts, and more. Explore the NPS API below and even try to make API calls. In order to try an API call, you'll need to click on the "Authorize" button below and add your API key. If you don't have an API key yet, visit our Get Started page.
  version: 1.0.0
  title: National Park Service Activities/parks API
servers:
- url: https://developer.nps.gov/api/v1
tags:
- name: activities/parks
  description: Retrieve national parks that are related to particular categories of activity (astronomy, hiking, wildlife watching, etc.).
paths:
  /activities/parks:
    get:
      tags:
      - activities/parks
      description: Returns activites parks information.
      operationId: getActvitiesParks
      parameters:
      - name: id
        in: query
        description: A comma delimited list of activity IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: q
        in: query
        description: A string to search for.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return per request. Default is 50.
        required: false
        schema:
          type: integer
      - name: start
        in: query
        description: Get the next [limit] results starting with this number. Default is 0.
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        description: A comma delimited list of fields to sort the results by. Ascending order is assumed for each field unless the field name is prefixed with the unary negative which implies descending order.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      security:
      - api_key: []
      - api_key_header: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPark'
        '400':
          description: Invalid status value
      summary: Get actvities parks
      x-summary-source: derived
components:
  schemas:
    ActivityPark:
      type: object
      properties:
        total:
          type: string
          example: '2'
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for activity park record.
                example: FEDA3DF8-B871-4C1A-BB96-32823860B174
              name:
                type: string
                description: Name for activity park record.
                example: Arts and Culture
              parks:
                type: array
                items:
                  type: object
                  properties:
                    states:
                      type: string
                      description: A comma delimited list of two letter state codes
                      example: KY
                    fullName:
                      type: string
                      description: full name of a park
                      example: Abraham Lincoln Birthplace National Historical Park
                    url:
                      type: string
                      example: https://www.nps.gov/abli/index.htm
                    parkCode:
                      type: string
                      description: Four letter alpha code for this park
                      example: abli
                    designation:
                      type: string
                      example: National Historical Park
                    name:
                      type: string
                      description: The name of the park
                      example: Abraham Lincoln Birthplace
        limit:
          type: string
          example: '50'
        start:
          type: string
          example: '0'
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: query
    api_key_header:
      type: apiKey
      name: X-Api-Key
      in: header
