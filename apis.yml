- aid: doi:doi-aquifer-codes-api
  name: Department of Interior aquifer-codes API
  description: >-
    Local aquifers in USGS data are identified by an aquifer name and geohydrologic unit code (a three-digit
    number related to the age of the formation, followed by a 4 or 5 character abbreviation for the geologic
    unit or aquifer name). For the age of formation (aquifer age), generally the smaller the number represents
    the younger the geohydrologic unit. Aquifer names and the definition of an aquifer can be very subjective.
    One rock unit may be called different aquifer names by different people. Local aquifers and layered
    aquifers are often grouped into larger named regional aquifers or aquifer systems. For example, the
    National Northern Atlantic Coastal Plain aquifer system (National aquifer) consists of five layered
    regional aquifers. Each regional aquifer is divided into two or more aquifers which may have a different
    name in each of the states in which the aquifer is found.
  humanURL: https://www.nps.gov/subjects/developer/index.htm
  baseURL: https://developer.nps.gov/api/v1
  tags:
  - aquifer-codes
  properties:
  - type: OpenAPI
    url: openapi/doi-aquifer-codes-api-openapi.yml
  - type: Documentation
    url: https://api.waterdata.usgs.gov/docs/
  - type: Migration
    url: https://api.waterdata.usgs.gov/docs/ogcapi/migration/
- aid: doi:doi-aquifer-types-api
  name: Department of Interior aquifer-types API
  description: >-
    Groundwater occurs in aquifers under two different conditions. Where water only partly fills an aquifer,
    the upper surface is free to rise and decline. These aquifers are referred to as unconfined (or water-table)
    aquifers. Where water completely fills an aquifer that is overlain by a confining bed, the aquifer
    is referred to as a confined (or artesian) aquifer. When a confined aquifer is penetrated by a well,
    the water level in the well will rise above the top of the aquifer (but not necessarily above land
    surface).
  humanURL: https://www.nps.gov/subjects/developer/index.htm
  baseURL: https://developer.nps.gov/api/v1
  tags:
  - aquifer-types
  properties:
  - type: OpenAPI
    url: openapi/doi-aquifer-types-api-openapi.yml
  - type: Documentation
    url: https://api.waterdata.usgs.gov/docs/
  - type: Migration
    url: https://api.waterdata.usgs.gov/docs/ogcapi/migration/
