- aid: doi:doi-time-zone-codes-api
  name: Department of Interior time-zone-codes API
  description: >-
    The ISO 8601 standard defines time zone offsets as a numerical value added to a local time to convert
    it to Coordinated Universal Time (UTC), either as +hh:mm or -hh:mm, or represented by the letter Z
    to explicitly indicate UTC. For example, +05:30 means 5 hours and 30 minutes ahead of UTC, while -08:00
    means 8 hours behind UTC. The offset Z specifically signifies UTC.
  humanURL: https://www.nps.gov/subjects/developer/index.htm
  baseURL: https://developer.nps.gov/api/v1
